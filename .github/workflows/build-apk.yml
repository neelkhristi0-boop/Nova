name: Build Boba APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK comes preinstalled on GitHub's Ubuntu machines (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Boba-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (direct phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-latest
          name: Boba (latest build)
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
